[project]
name = "nih-science-agent"
version = "0.1.0"
description = "Tool-first AI-for-science platform mapping NIH-funded research from awards to discoveries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chirag Patel" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "duckdb>=0.10",
    "pandas>=2.2",
    "pyarrow>=15",
    "typer>=0.12",
    "networkx>=3.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]
notebooks = [
    "jupyter>=1",
    "ipykernel>=6",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
]

[project.scripts]
nih-agent = "nih_science_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nih_science_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer requires function calls (typer.Option/Argument) as parameter defaults.
"src/nih_science_agent/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
